<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://*.gstatic.com https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://*.google.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; frame-src https://accounts.google.com https://*.google.com; img-src 'self' blob: data: https://*.gstatic.com https://*.googleusercontent.com https://*.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://*.gstatic.com; font-src 'self' https://*.gstatic.com; object-src 'none'; base-uri 'none'">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101418">
<title>PayTrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PayTrack">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <div id="topbar-left">
    <button id="nav-toggle" title="Show / hide menu"></button>
    <h1>PayTrack <span id="ver"></span></h1>
  </div>
  <div id="topbar-right">
    <button id="money-eye" title="Show / hide dollar amounts"></button>
    <div id="conn-status" title="Google connection status">●</div>
  </div>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-view="home" class="active">Home</button>
  <button data-view="jobs">Jobs</button>
  <button data-view="stub">Stub</button>
  <button data-view="review">Import</button>
  <button data-view="settings">Setup</button>
</nav>

<div id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
