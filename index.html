<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>PayTrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PayTrack">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <h1>PayTrack</h1>
  <div id="conn-status" title="Google connection status">●</div>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-view="home" class="active">🏠<span>Home</span></button>
  <button data-view="jobs">🎬<span>Jobs</span></button>
  <button data-view="stub">📸<span>Stub</span></button>
  <button data-view="review">📥<span>Review</span></button>
  <button data-view="settings">⚙️<span>Setup</span></button>
</nav>

<div id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
