<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>PayTrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PayTrack">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <h1>PayTrack <span id="ver"></span></h1>
  <div id="topbar-right">
    <button id="money-eye" title="Show / hide dollar amounts"></button>
    <div id="conn-status" title="Google connection status">●</div>
  </div>
</header>

<main id="view"></main>

<nav id="tabs">
  <button data-view="home" class="active">Home</button>
  <button data-view="jobs">Jobs</button>
  <button data-view="stub">Stub</button>
  <button data-view="totals">Totals</button>
  <button data-view="review">Review</button>
  <button data-view="settings">Setup</button>
</nav>

<div id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
